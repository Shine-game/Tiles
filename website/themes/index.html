<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="See how tiles grow and combine in the four SIMIS themes."><title>Themes · SIMIS</title><link rel="stylesheet" href="../style.css"><script src="../theme-growth.js" defer></script></head><body><header class="shell header">
  <a class="wordmark" href="../" aria-label="SIMIS home"><img src="../assets/simis-logo.png" width="32" height="32" alt=""></a>
  <nav aria-label="Main navigation">
    <a href="../">Home</a>
    <a href="../how-to-play/">How to play</a>
    <a href="../themes/" aria-current="page">Themes</a>
    <a href="../mailing-list/">Mailing list</a>
  </nav>
</header><main class="shell play-guide">
  <h1>Themes</h1>
  <p>Hover over an image or select it to watch tiles combine.</p>
  <div class="theme-growth">
    <section class="theme-panel theme-vines" aria-labelledby="vines-title">
      <h2 id="vines-title">Vines</h2>
      <div class="theme-media">
        <div class="growth-previews">
          <figure>
            <button class="growth-preview" type="button" aria-label="Watch a flower open" aria-pressed="false" data-animation="../assets/growth/vines-2.gif">
              <img src="../assets/growth/vines-2.webp" width="320" height="320" alt="" loading="lazy">
            </button>
            <figcaption>Tier 2 · Flower</figcaption>
          </figure>
          <figure>
            <button class="growth-preview" type="button" aria-label="Watch a butterfly appear" aria-pressed="false" data-animation="../assets/growth/vines-3.gif">
              <img src="../assets/growth/vines-3.webp" width="320" height="320" alt="" loading="lazy">
            </button>
            <figcaption>Tier 3 · Butterfly</figcaption>
          </figure>
        </div>
        <video class="theme-video" controls playsinline preload="none" width="392" height="698"
          poster="../assets/gameplay/vines.webp" aria-label="Vines gameplay">
          <source src="../assets/gameplay/vines.mp4" type="video/mp4">
          <a href="../assets/gameplay/vines.mp4">Watch Vines gameplay</a>
        </video>
      </div>
    </section>
    <section class="theme-panel theme-clockwork" aria-labelledby="clockwork-title">
      <h2 id="clockwork-title">Clockwork Workshop</h2>
      <div class="theme-media">
        <div class="growth-previews">
          <figure>
            <button class="growth-preview" type="button" aria-label="Watch a mechanism assemble" aria-pressed="false" data-animation="../assets/growth/clockwork-2.gif">
              <img src="../assets/growth/clockwork-2.webp" width="320" height="320" alt="" loading="lazy">
            </button>
            <figcaption>Tier 2 · Mechanism</figcaption>
          </figure>
          <figure>
            <button class="growth-preview" type="button" aria-label="Watch two mechanisms connect" aria-pressed="false" data-animation="../assets/growth/clockwork-3.gif">
              <img src="../assets/growth/clockwork-3.webp" width="320" height="320" alt="" loading="lazy">
            </button>
            <figcaption>Tier 3 · Connecting chain</figcaption>
          </figure>
        </div>
        <video class="theme-video" controls playsinline preload="none" width="392" height="698"
          poster="../assets/gameplay/clockwork.webp" aria-label="Clockwork Workshop gameplay">
          <source src="../assets/gameplay/clockwork.mp4" type="video/mp4">
          <a href="../assets/gameplay/clockwork.mp4">Watch Clockwork Workshop gameplay</a>
        </video>
      </div>
    </section>
    <section class="theme-panel theme-coral_reef" aria-labelledby="coral_reef-title">
      <h2 id="coral_reef-title">Coral Reef</h2>
      <div class="theme-media">
        <div class="growth-previews">
          <figure>
            <button class="growth-preview" type="button" aria-label="Watch a coral colony grow" aria-pressed="false" data-animation="../assets/growth/coral_reef-2.gif">
              <img src="../assets/growth/coral_reef-2.webp" width="320" height="320" alt="" loading="lazy">
            </button>
            <figcaption>Tier 2 · Coral colony</figcaption>
          </figure>
          <figure>
            <button class="growth-preview" type="button" aria-label="Watch an anemone form" aria-pressed="false" data-animation="../assets/growth/coral_reef-3.gif">
              <img src="../assets/growth/coral_reef-3.webp" width="320" height="320" alt="" loading="lazy">
            </button>
            <figcaption>Tier 3 · Anemone</figcaption>
          </figure>
        </div>
        <video class="theme-video" controls playsinline preload="none" width="392" height="698"
          poster="../assets/gameplay/coral-reef.webp" aria-label="Coral Reef gameplay">
          <source src="../assets/gameplay/coral-reef.mp4" type="video/mp4">
          <a href="../assets/gameplay/coral-reef.mp4">Watch Coral Reef gameplay</a>
        </video>
      </div>
    </section>
    <section class="theme-panel theme-christmas_joy" aria-labelledby="christmas_joy-title">
      <h2 id="christmas_joy-title">Christmas Joy</h2>
      <div class="theme-media">
        <div class="growth-previews">
          <figure>
            <button class="growth-preview" type="button" aria-label="Watch snowy tiles join in a two-by-two arrangement" aria-pressed="false" data-animation="../assets/growth/christmas_joy-2.gif">
              <img src="../assets/growth/christmas_joy-2.webp" width="320" height="320" alt="" loading="lazy">
            </button>
            <figcaption>2 × 2 · Snowy tile growth</figcaption>
          </figure>
          <figure>
            <button class="growth-preview" type="button" aria-label="Watch snowy tiles join in a two-by-three arrangement" aria-pressed="false" data-animation="../assets/growth/christmas_joy-3.gif">
              <img src="../assets/growth/christmas_joy-3.webp" width="320" height="320" alt="" loading="lazy">
            </button>
            <figcaption>2 × 3 · Snowy tile growth</figcaption>
          </figure>
        </div>
        <p class="theme-video-pending">Coming soon</p>
      </div>
    </section>
  </div>
</main>
<footer class="shell footer">

  <img src="../assets/preserve-the-symmetry.png" width="1104" height="304" alt="Preserve the symmetry">

</footer>
</body></html>
